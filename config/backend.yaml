# Which ModelBackend implementation is active. Swapping this value (and,
# once it's implemented, running against CUDA hardware) is the entire cost
# of moving from Phase 1 (MLX, Apple Silicon) to the confirmed production
# target (CUDA + QLoRA, Linux + NVIDIA/AMD GPU) — nothing else in the
# control plane, specialization loop, or evaluation harness should need to
# change. See docs/technical-build-plan-v5.md, "Model Backend Abstraction."
backend: mlx

model_version: "mlx-community/Qwen2.5-3B-Instruct-4bit"

# batch_size/max_seq_length/grad_checkpoint defaults are set per
# docs/lora-memory-footprint-spike-v1.md: on this 8GB machine, batch_size 4
# (mlx_lm's own default) caused both a 5.86GB peak footprint and a NaN loss
# divergence by iteration 2. batch_size<=2 with grad_checkpoint on stayed in
# the 3-5GB range and trained stably.
lora:
  rank: 8
  alpha: 16
  epochs: 3
  learning_rate: 1e-5
  batch_size: 2
  max_seq_length: 512
  grad_checkpoint: true

# Which AuditStore implementation is active. SQLite is the Phase 1 /
# local-development backend (append-only, hash-chained, but not itself
# production-grade — no replication/access control/retention). PostgreSQL is
# the confirmed production backend — see
# src/slmguard/audit/postgres_store.py for the parity checklist. Swapping
# `backend: sqlite` for `backend: postgres` (and `location` for a DSN) is
# meant to be the entire cost of retargeting the audit trail to production.
audit_store:
  backend: sqlite
  location: "data/audit.db"

# Which Teacher implementation generate-data uses to produce synthetic
# scenario/label pairs. OpenRouter is the Phase 1 default (see
# docs/generate-data-v1.md) -- swapping to a direct Claude API teacher or a
# larger local model means implementing src/slmguard/teacher/base.py's
# Teacher interface again, nothing else should need to change. Requires
# OPENROUTER_API_KEY in the environment.
#
# model_id chosen 2026-08-20 by querying OpenRouter's live free-tier catalog
# (slmguard.teacher.openrouter_teacher.list_free_models): the strongest
# NVIDIA Nemotron free variant whose free tier still supports
# response_format/structured_outputs (the larger nemotron-3-ultra-550b-a55b
# free variant does not support structured output, per the live catalog --
# reliability for this JSON-generation task mattered more than raw size).
# OpenRouterTeacher refuses at construction time to run any model not
# confirmed free by that same live catalog -- this value is enforced, not
# just documented.
teacher:
  backend: openrouter
  model_id: "nvidia/nemotron-3-super-120b-a12b:free"
